<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COVID-19 Early Outbreak Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{background:#0f172a;color:white;font-family:Arial;padding:15px;text-align:center}
select,input,button{padding:10px;margin:5px;border-radius:8px;border:none;font-size:16px}
button{background:#2563eb;color:white}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.card{background:#1e293b;padding:15px;border-radius:12px}
.card b{font-size:28px}
.blue{color:#60a5fa}.red{color:#f87171}.green{color:#4ade80}.orange{color:#fb923c}
.box{background:#1e293b;padding:15px;border-radius:12px;margin-top:15px}
</style>
</head>
<body>
<h2>COVID-19 Early Outbreak Dashboard</h2>

<div class="box">
<select id="countrySelect"></select><br>
From: <input type="date" id="fromDate" value="2020-02-01">
To: <input type="date" id="toDate" value="2020-03-31"><br>
<button onclick="updateDashboard()">Update</button>
</div>

<div class="cards">
<div class="card">Confirmed<br><b class="blue" id="confirmed">0</b></div>
<div class="card">Deaths<br><b class="red" id="deaths">0</b></div>
<div class="card">Recovered<br><b class="green" id="recovered">0</b></div>
<div class="card">Active<br><b class="orange" id="active">0</b></div>
</div>

<div class="box"><canvas id="myChart"></canvas></div>

<script>
let allData = [];
let myChart = null;

fetch('covid-19.json')
.then(r => r.json())
.then(json => {
  allData = json.countries;
  const sel = document.getElementById('countrySelect');
  allData.forEach(c => {
    const o = document.createElement('option');
    o.value = c.country;
    o.textContent = c.country;
    sel.appendChild(o);
  });
  updateDashboard();
});

function updateDashboard(){
  const name = document.getElementById('countrySelect').value;
  const country = allData.find(c => c.country === name);
  if(!country) return;
  const from = document.getElementById('fromDate').value;
  const to = document.getElementById('toDate').value;
  const filtered = country.data.filter(d => d.date >= from && d.date <= to);
  const show = filtered.length ? filtered : country.data;
  const last = show[show.length-1];
  document.getElementById('confirmed').textContent = last.confirmed || 0;
  document.getElementById('deaths').textContent = last.deaths || 0;
  document.getElementById('recovered').textContent = last.recovered || 0;
  document.getElementById('active').textContent = (last.confirmed||0) - (last.deaths||0) - (last.recovered||0);

  if(myChart) myChart.destroy();
  myChart = new Chart(document.getElementById('myChart'), {
    type:'bar'
    data:{
      labels: show.map(d=>d.date),
      datasets:[{label:'Confirmed', data: show.map(d=>d.confirmed), borderColor:'#60a5fa', fill:false}]
    },
    options:{plugins:{legend:{labels:{color:'white'}}}, scales:{x:{ticks:{color:'white'}}, y:{ticks:{color:'white'}}}}
  });
}
</script>
</body>
</html>
